[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-code-workspace"
version = "0.1.0"
description = "Local workspace helpers and unified collection entrypoints for the brain-code repository."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
gui = [
    "PyQt5>=5.15,<6",
    "matplotlib",
]
ssvep = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "brainflow>=5,<6",
    "pyserial>=3.5,<4",
    "paramiko>=3.4,<4",
    "PyQt5>=5.15,<6",
    "matplotlib",
]
mi = [
    "numpy",
    "scipy",
    "mne",
    "scikit-learn",
    "moabb",
    "pyriemann",
    "matplotlib",
    "seaborn",
    "PyYAML>=6,<7",
    "tqdm",
    "brainflow>=5,<6",
    "PyQt5>=5.15,<6",
    "pyserial>=3.5,<4",
    "joblib",
]
hybrid = [
    "PyQt5>=5.15,<6",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "opencv-python>=4.9,<5",
    "ultralytics>=8,<9",
    "brainflow>=5,<6",
    "roslibpy>=1.6,<2",
    "PyYAML>=6,<7",
    "pyserial>=3.5,<4",
    "paramiko>=3.4,<4",
]
robot = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "opencv-python>=4.9,<5",
]
gpu = [
    "cupy-cuda12x",
]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["brain*", "brain_workspace*", "unified_collection*", "hybrid_controller*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "tests",
    "02_SSVEP/tests",
    "hybrid_controller/tests",
]
python_files = ["test_*.py"]
pythonpath = [
    ".",
    "02_SSVEP",
    "01_MI/mi_classifier_latest/code/collection",
    "01_MI/mi_classifier_latest/code/shared",
]
norecursedirs = [
    ".git",
    ".idea",
    "__pycache__",
    ".pytest_cache",
    ".pytest_tmp*",
    ".tmp*",
    "pytest-cache-files-*",
    "pytest_tmp*",
    "pytest_temp*",
    "tmp_pytest*",
    "artifacts",
    "dataset",
    "datasets",
    "runtime",
    "logs",
    "_archive",
    "2026-03_realtime_ui_and_online_decoder",
    "2026-04_async_fbcca_idle_decoder",
]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]
