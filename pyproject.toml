[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-code-workspace"
version = "0.1.0"
description = "Local workspace helpers and unified collection entrypoints for the brain-code repository."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
gui = [
    "PyQt5>=5.15,<6",
    "matplotlib",
]
paper = [
    "pandas>=2.2,<3",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
    "pingouin>=0.5,<1",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<7",
    "nbformat>=5,<6",
    "nbconvert>=7,<8",
    "openpyxl>=3.1,<4",
    "xlsxwriter>=3.2,<4",
    "python-docx>=1.1,<2",
    "pypdf>=5,<7",
    "pdfplumber>=0.11,<1",
    "reportlab>=4,<5",
    "bibtexparser>=1.4,<2",
    "pybtex>=0.24,<1",
    "pypandoc-binary>=1.15,<2",
    "SciencePlots>=2.1,<3",
    "plotly>=6.1,<7",
    "kaleido>=1,<2",
    "tabulate>=0.9,<1",
    "jinja2>=3.1,<4",
    "pylatex>=1.4,<2",
    "statannotations>=0.7,<1",
]
ssvep = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "brainflow>=5,<6",
    "pyserial>=3.5,<4",
    "paramiko>=3.4,<4",
    "PyQt5>=5.15,<6",
    "matplotlib",
]
mi = [
    "numpy",
    "scipy",
    "mne",
    "scikit-learn",
    "moabb",
    "pyriemann",
    "matplotlib",
    "seaborn",
    "PyYAML>=6,<7",
    "tqdm",
    "brainflow>=5,<6",
    "PyQt5>=5.15,<6",
    "pyserial>=3.5,<4",
    "joblib",
]
hybrid = [
    "PyQt5>=5.15,<6",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "opencv-python>=4.9,<5",
    "ultralytics>=8,<9",
    "lap>=0.5.12,<1",
    "brainflow>=5,<6",
    "roslibpy>=1.6,<2",
    "PyYAML>=6,<7",
    "pyserial>=3.5,<4",
    "paramiko>=3.4,<4",
]
robot = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "opencv-python>=4.9,<5",
]
packaging = [
    "pyinstaller>=6,<7",
]
gpu = [
    "cupy-cuda12x",
]

[project.scripts]
brain = "brain.cli:main"
brain-pretrain-ui = "pretrain_ui.app:main"
brain-integrated-workbench = "robot_workbench.app:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["brain*", "brain_workspace*", "unified_collection*", "hybrid_controller*", "pretrain_ui*", "robot_workbench*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "tests",
    "02_SSVEP/tests",
    "hybrid_controller/tests",
]
python_files = ["test_*.py"]
pythonpath = [
    ".",
]
norecursedirs = [
    ".git",
    ".idea",
    "__pycache__",
    ".pytest_cache",
    ".pytest_tmp*",
    ".tmp*",
    "pytest-cache-files-*",
    "pytest_tmp*",
    "pytest_temp*",
    "tmp_pytest*",
    "artifacts",
    "dataset",
    "datasets",
    "runtime",
    "logs",
    "_archive",
    "2026-03_realtime_ui_and_online_decoder",
    "2026-04_async_fbcca_idle_decoder",
]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]
